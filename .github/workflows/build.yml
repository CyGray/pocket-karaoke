name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust unit tests / formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked

  windows:
    name: Native Windows Slint GUI + CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked --bin pocket-karaoke --bin pocket-karaoke-cli
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-karaoke-windows
          path: |
            target/release/pocket-karaoke.exe
            target/release/pocket-karaoke-cli.exe
          if-no-files-found: error

  android:
    name: Android native microphone APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle --no-daemon --max-workers=2 -p android assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-karaoke-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-tests, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pocket-karaoke-windows
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: pocket-karaoke-android
          path: dist/android
      - run: mv dist/android/app-debug.apk dist/android/pocket-karaoke-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/windows/pocket-karaoke.exe
            dist/windows/pocket-karaoke-cli.exe
            dist/android/pocket-karaoke-android.apk
