plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cygray.pocketkaraoke'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cygray.pocketkaraoke'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
    }
}
